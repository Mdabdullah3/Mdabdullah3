name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation SVG
        uses: Platane/snk@v3
        with:
          github_user_name: Mdabdullah3
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7FD63A&color_dots=#ebedf0,#dbf3b3,#c2ea7e,#9ce04f,#7FD63A
            dist/github-contribution-grid-snake-dark.svg?color_snake=#B4F04C&color_dots=#161b22,#2b3a16,#4f7320,#86b32d,#B4F04C

      - name: Push output to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
