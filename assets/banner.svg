<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b12"/>
      <stop offset="55%" stop-color="#0a121d"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0D1"/>
      <stop offset="55%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0088CC"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0D1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F0D1" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0088CC" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blobTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00C7B7" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#00C7B7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0088CC" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0088CC" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>

  <!-- ambient glow blobs -->
  <circle cx="140" cy="55" r="150" fill="url(#blobTeal)" filter="url(#softBlur)">
    <animate attributeName="cx" values="140;230;140" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="255" r="170" fill="url(#blobBlue)" filter="url(#softBlur)">
    <animate attributeName="cy" values="255;190;255" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- network / node motif (nods to blockchain & Telegram/TON work) -->
  <g stroke="#1c3a4d" stroke-width="1.1" opacity="0.7">
    <line x1="40" y1="255" x2="150" y2="205"/>
    <line x1="150" y1="205" x2="250" y2="250"/>
    <line x1="150" y1="205" x2="90" y2="140"/>
    <line x1="960" y1="55" x2="1070" y2="95"/>
    <line x1="1070" y1="95" x2="1150" y2="55"/>
    <line x1="1070" y1="95" x2="1030" y2="160"/>
  </g>
  <g fill="#00F0D1">
    <circle cx="40" cy="255" r="2.6"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="205" r="3.4"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="250" r="2.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="140" r="2.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#0088CC">
    <circle cx="960" cy="55" r="2.6"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="1070" cy="95" r="3.4"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="55" r="2.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="160" r="2.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- name -->
  <text x="600" y="132" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="800" letter-spacing="3" fill="url(#textGrad)" text-anchor="middle">MD ABDULLAH</text>

  <!-- animated underline accent -->
  <rect x="500" y="150" width="200" height="3" fill="url(#lineGrad)" rx="1.5">
    <animate attributeName="width" values="0;200;200" keyTimes="0;0.4;1" dur="2.4s" fill="freeze"/>
    <animate attributeName="x" values="600;500;500" keyTimes="0;0.4;1" dur="2.4s" fill="freeze"/>
  </rect>

  <!-- role subtitle (static — kept renderer-safe across browsers/apps) -->
  <text x="600" y="192" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#9fb3c8" text-anchor="middle">Full Stack Developer · Telegram Mini Apps &amp; TON Wallet Specialist</text>

  <!-- tech chip row -->
  <text x="600" y="240" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" letter-spacing="1.5" fill="#5d7488" text-anchor="middle">REACT · NEXT.JS · NODE.JS · MONGODB · TELEGRAM SDK · TON · SANITY · SHOPIFY</text>

  <!-- base accent bar -->
  <rect x="0" y="296" width="1200" height="4" fill="url(#textGrad)"/>
</svg>
