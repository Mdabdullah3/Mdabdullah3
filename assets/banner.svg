<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&amp;family=Space+Grotesk:wght@400;500&amp;display=swap');
    </style>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050409"/>
      <stop offset="100%" stop-color="#0c0914"/>
    </linearGradient>
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="55%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1a1428"/>
    </pattern>
    <clipPath id="nameClip">
      <text x="600" y="132" font-family="'Sora','Segoe UI',sans-serif" font-size="52" font-weight="600" letter-spacing="4" text-anchor="middle">MD ABDULLAH</text>
    </clipPath>
  </defs>

  <!-- base -->
  <rect width="1200" height="300" rx="22" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" rx="22" fill="url(#dotGrid)" opacity="0.35"/>

  <!-- single soft glow, off-center -->
  <circle cx="920" cy="60" r="260" fill="url(#glow)" filter="url(#softBlur)"/>

  <!-- name -->
  <text x="600" y="132" font-family="'Sora','Segoe UI',sans-serif" font-size="52" font-weight="600" letter-spacing="4" fill="#f5f3f7" text-anchor="middle">MD ABDULLAH</text>

  <!-- shimmer sweep, clipped to the name -->
  <rect x="0" y="80" width="130" height="80" fill="url(#shimmerGrad)" clip-path="url(#nameClip)" transform="skewX(-20)">
    <animate attributeName="x" values="0;1200" dur="5s" begin="0.8s" repeatCount="indefinite"/>
  </rect>

  <!-- thin accent line -->
  <rect x="566" y="154" width="68" height="2" rx="1" fill="url(#auroraGrad)"/>

  <!-- subtitle, with a single colored emphasis -->
  <text x="600" y="190" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="18" text-anchor="middle" fill="#9c92b4">
    Full Stack Developer <tspan fill="#867ba0">·</tspan> Telegram Mini Apps &amp; <tspan fill="url(#auroraGrad)" font-weight="600">Shopify Specialist</tspan>
  </text>

  <!-- minimal tech list, plain text, no boxes -->
  <text x="600" y="230" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="11.5" letter-spacing="3" text-anchor="middle" fill="#4d456a">REACT · NEXT.JS · NODE.JS · MONGODB · SHOPIFY · TELEGRAM · TON</text>

  <!-- thin outer frame -->
  <rect x="1.5" y="1.5" width="1197" height="297" rx="20" fill="none" stroke="#221a36" stroke-width="1"/>

  <rect width="1200" height="300" rx="22" fill="url(#vignette)"/>
</svg>
