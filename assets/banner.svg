<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');
    </style>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05040a"/>
      <stop offset="55%" stop-color="#0f0a1a"/>
      <stop offset="100%" stop-color="#170e2b"/>
    </linearGradient>
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#EC4899" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blobViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
    <filter id="chipGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <pattern id="dotGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#1c1430"/>
    </pattern>
    <clipPath id="nameClip">
      <text x="60" y="140" font-family="'Sora','Segoe UI',sans-serif" font-size="58" font-weight="800" letter-spacing="1">MD ABDULLAH</text>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="1200" height="340" rx="22" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" rx="22" fill="url(#dotGrid)" opacity="0.5"/>

  <!-- ambient glow -->
  <circle cx="150" cy="60" r="190" fill="url(#blobViolet)" filter="url(#softBlur)">
    <animate attributeName="cx" values="150;230;150" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="260" r="220" fill="url(#blobAmber)" filter="url(#softBlur)">
    <animate attributeName="cy" values="260;190;260" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- ghost monogram (right side decorative anchor) -->
  <text x="960" y="245" font-family="'Sora','Segoe UI',sans-serif" font-size="270" font-weight="800" fill="none" stroke="url(#auroraGrad)" stroke-opacity="0.16" stroke-width="2" text-anchor="middle">MA</text>

  <!-- orbit motif around monogram -->
  <g stroke="url(#auroraGrad)" fill="none" opacity="0.28">
    <ellipse cx="960" cy="168" rx="230" ry="90"/>
    <ellipse cx="960" cy="168" rx="140" ry="150"/>
  </g>
  <circle r="4" fill="#F59E0B">
    <animateMotion dur="9s" repeatCount="indefinite" path="M 1190,168 A 230,90 0 1,1 730,168 A 230,90 0 1,1 1190,168"/>
  </circle>
  <circle r="3.5" fill="#EC4899">
    <animateMotion dur="12s" repeatCount="indefinite" path="M 960,18 A 140,150 0 1,1 959.9,18 A 140,150 0 1,1 960,18"/>
  </circle>

  <!-- vertical column divider -->
  <line x1="686" y1="46" x2="686" y2="288" stroke="#2a2044" stroke-width="1"/>

  <!-- kicker / status pill -->
  <rect x="60" y="34" width="208" height="28" rx="14" fill="#140f22" stroke="url(#auroraGrad)" stroke-opacity="0.55"/>
  <circle cx="78" cy="48" r="4" fill="#F59E0B">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="92" y="52" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="12" letter-spacing="1.5" fill="#c9b8e8">OPEN TO NEW PROJECTS</text>

  <!-- name -->
  <text x="60" y="140" font-family="'Sora','Segoe UI',sans-serif" font-size="58" font-weight="800" letter-spacing="1" fill="url(#auroraGrad)">MD ABDULLAH</text>

  <!-- shimmer sweep clipped to name -->
  <rect x="-460" y="80" width="150" height="90" fill="url(#shimmerGrad)" clip-path="url(#nameClip)" transform="skewX(-20)">
    <animate attributeName="x" values="-460;900" dur="4.5s" begin="0.6s" repeatCount="indefinite"/>
  </rect>

  <!-- underline accent -->
  <rect x="60" y="156" width="0" height="3" fill="url(#lineGrad)" rx="1.5">
    <animate attributeName="width" values="0;170;170" keyTimes="0;0.4;1" dur="2s" fill="freeze"/>
  </rect>

  <!-- role subtitle -->
  <text x="60" y="188" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="19" fill="#e4dcf4">Full Stack Developer <tspan fill="#9a8ec2">·</tspan> Telegram Mini Apps &amp; Shopify Specialist</text>

  <!-- tagline -->
  <text x="60" y="212" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="13.5" fill="#8a7fa8">Building scalable web apps, headless commerce &amp; Web3 mini apps since 2023</text>

  <!-- tech chips — row 1 -->
  <g font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="12.5" font-weight="600">
    <rect x="60" y="230" width="70" height="30" rx="15" fill="#140f22" fill-opacity="0.75" stroke="#2a2044"/>
    <text x="95" y="250" fill="#c3b6de" text-anchor="middle">React</text>

    <rect x="140" y="230" width="88" height="30" rx="15" fill="#140f22" fill-opacity="0.75" stroke="#2a2044"/>
    <text x="184" y="250" fill="#c3b6de" text-anchor="middle">Next.js</text>

    <rect x="238" y="230" width="88" height="30" rx="15" fill="#140f22" fill-opacity="0.75" stroke="#2a2044"/>
    <text x="282" y="250" fill="#c3b6de" text-anchor="middle">Node.js</text>

    <rect x="336" y="230" width="92" height="30" rx="15" fill="#140f22" fill-opacity="0.75" stroke="#2a2044"/>
    <text x="382" y="250" fill="#c3b6de" text-anchor="middle">MongoDB</text>

    <rect x="438" y="230" width="130" height="30" rx="15" fill="#140f22" fill-opacity="0.75" stroke="#2a2044"/>
    <text x="503" y="250" fill="#c3b6de" text-anchor="middle">Telegram SDK</text>

    <!-- row 2 -->
    <rect x="60" y="270" width="58" height="30" rx="15" fill="#140f22" fill-opacity="0.75" stroke="#2a2044"/>
    <text x="89" y="290" fill="#c3b6de" text-anchor="middle">TON</text>

    <rect x="128" y="270" width="78" height="30" rx="15" fill="#140f22" fill-opacity="0.75" stroke="#2a2044"/>
    <text x="167" y="290" fill="#c3b6de" text-anchor="middle">Sanity</text>

    <!-- Shopify — featured chip -->
    <rect x="128" y="270" width="78" height="30" rx="15" fill="#140f22" fill-opacity="0.75" stroke="#2a2044"/>
    <text x="167" y="290" fill="#c3b6de" text-anchor="middle">Shopify</text>
  </g>

  <!-- stats strip -->
  <g font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="12" fill="#7a6f96">
    <text x="60" y="320" font-weight="700" fill="#e4dcf4">2.5+ <tspan fill="#7a6f96" font-weight="400">YRS EXPERIENCE</tspan></text>
    <line x1="185" y1="308" x2="185" y2="320" stroke="#2a2044"/>
    <text x="200" y="320" font-weight="700" fill="#e4dcf4">20+ <tspan fill="#7a6f96" font-weight="400">PROJECTS</tspan></text>
    <line x1="305" y1="308" x2="305" y2="320" stroke="#2a2044"/>
    <text x="320" y="320" fill="#7a6f96">DHAKA, BANGLADESH</text>
  </g>

  <!-- right side quick info -->
  <g font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="12.5" fill="#8a7fa8">
    <text x="712" y="80" letter-spacing="2" font-size="11" fill="#5c5178">CURRENTLY</text>
    <text x="712" y="104" fill="#e4dcf4" font-weight="600">Full Stack Developer</text>
    <text x="712" y="124">@ Most Lab</text>

    <text x="712" y="168" letter-spacing="2" font-size="11" fill="#5c5178">SPECIALIZED IN</text>
    <text x="712" y="192" fill="#e4dcf4" font-weight="600">Shopify Storefronts</text>
    <text x="712" y="212">Telegram Mini Apps · TON Wallet</text>

    <text x="712" y="256" letter-spacing="2" font-size="11" fill="#5c5178">CONTACT</text>
    <text x="712" y="280" fill="#e4dcf4" font-weight="600">mdabdullah.dev@gmail.com</text>
  </g>

  <!-- outer card frame -->
  <rect x="2.5" y="2.5" width="1195" height="335" rx="20" fill="none" stroke="url(#auroraGrad)" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect width="1200" height="340" rx="22" fill="url(#vignette)"/>
</svg>
