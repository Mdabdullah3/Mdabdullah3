<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0D12"/>
      <stop offset="0.6" stop-color="#10151C"/>
      <stop offset="1" stop-color="#161C25"/>
    </linearGradient>

    <linearGradient id="panel" x1="870" y1="300" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9CE03C"/>
      <stop offset="1" stop-color="#C8F76A"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B4F04C"/>
      <stop offset="1" stop-color="#B4F04C" stop-opacity="0.15"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#B4F04C" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#B4F04C" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>

    <!-- bold motif used inside the lime panel -->
    <pattern id="chevronBold" width="112" height="54" patternUnits="userSpaceOnUse">
      <path d="M-56 43 L-28 13 L0 43 L28 13 L56 43 L84 13 L112 43 L140 13 L168 43" fill="none" stroke="#1A202B" stroke-width="13"/>
    </pattern>

    <!-- whisper-thin motif used as texture on the dark side -->
    <pattern id="chevronFaint" width="112" height="54" patternUnits="userSpaceOnUse">
      <path d="M-56 43 L-28 13 L0 43 L28 13 L56 43 L84 13 L112 43 L140 13 L168 43" fill="none" stroke="#B4F04C" stroke-width="2"/>
    </pattern>

    <linearGradient id="textureFade" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="textureMask">
      <rect width="900" height="300" fill="url(#textureFade)"/>
    </mask>

    <clipPath id="frame">
      <rect width="1200" height="300" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>

    <!-- faint texture on the dark side -->
    <g mask="url(#textureMask)" opacity="0.055">
      <rect width="900" height="300" fill="url(#chevronFaint)"/>
    </g>

    <circle cx="880" cy="150" r="300" fill="url(#glow)" filter="url(#soft)"/>

    <!-- lime panel, angled -->
    <polygon points="930,0 1200,0 1200,300 870,300" fill="url(#panel)"/>
    <polygon points="930,0 1200,0 1200,300 870,300" fill="url(#chevronBold)" opacity="0.92"/>
    <line x1="930" y1="0" x2="870" y2="300" stroke="#0A0D12" stroke-width="2" opacity="0.45"/>

    <!-- status pill -->
    <rect x="72" y="54" width="214" height="30" rx="15" fill="#B4F04C" fill-opacity="0.07" stroke="#B4F04C" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="92" cy="69" r="4" fill="#B4F04C">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="106" y="73.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11" font-weight="500" letter-spacing="2.6" fill="#B4F04C">AVAILABLE FOR WORK</text>

    <!-- name -->
    <text x="70" y="162" font-family="'Sora','Segoe UI',system-ui,sans-serif" font-size="60" font-weight="600" letter-spacing="2" fill="#F4F8EE">MD ABDULLAH</text>

    <!-- accent rule -->
    <rect x="72" y="184" width="120" height="3" rx="1.5" fill="url(#rule)"/>

    <!-- role -->
    <text x="72" y="220" font-family="'Sora','Segoe UI',system-ui,sans-serif" font-size="19" font-weight="400" fill="#9AA6B2">
      Full Stack Developer <tspan fill="#39462C">/</tspan> <tspan fill="#B4F04C" font-weight="600">Telegram Mini Apps &amp; Shopify</tspan>
    </text>

    <!-- meta strip -->
    <text x="72" y="256" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11" letter-spacing="2.6" fill="#4C5663">3+ YEARS · NEXT.JS · TYPESCRIPT · NODE.JS · TON · DHAKA, BD</text>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="19.25" fill="none" stroke="#202834" stroke-width="1.5"/>
</svg>
