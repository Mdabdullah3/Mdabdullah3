<svg width="1200" height="160" viewBox="0 0 1200 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
    </style>

    <linearGradient id="limeBase" x1="0" y1="0" x2="1200" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D6FB7C"/>
      <stop offset="0.45" stop-color="#BCF356"/>
      <stop offset="1" stop-color="#9ADE2E"/>
    </linearGradient>

    <radialGradient id="sheenTL" cx="18%" cy="10%" r="72%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="baseShade" x1="0" y1="90" x2="0" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#222838" stop-opacity="0"/>
      <stop offset="1" stop-color="#222838" stop-opacity="0.09"/>
    </linearGradient>

    <pattern id="chevron" width="112" height="54" patternUnits="userSpaceOnUse">
      <path d="M-56 43 L-28 13 L0 43 L28 13 L56 43 L84 13 L112 43 L140 13 L168 43" fill="none" stroke="#222838" stroke-width="13"/>
    </pattern>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.16"/>
      </feComponentTransfer>
    </filter>

    <filter id="lift" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2F4A05" flood-opacity="0.28"/>
    </filter>

    <radialGradient id="vignette" cx="50%" cy="45%" r="80%">
      <stop offset="0.6" stop-color="#4C7A0A" stop-opacity="0"/>
      <stop offset="1" stop-color="#4C7A0A" stop-opacity="0.18"/>
    </radialGradient>

    <clipPath id="card">
      <rect width="1200" height="160" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="160" fill="url(#limeBase)"/>

    <g opacity="0.05">
      <rect width="1200" height="160" fill="url(#chevron)"/>
    </g>

    <rect width="1200" height="160" fill="url(#sheenTL)"/>
    <rect width="1200" height="160" fill="url(#baseShade)"/>
    <rect width="1200" height="160" filter="url(#grain)" opacity="0.5"/>

    <rect width="1200" height="1.5" fill="#FFFFFF" opacity="0.4"/>

    <!-- closing statement -->
    <text x="76" y="64" font-family="'Sora','Segoe UI',system-ui,sans-serif" font-size="30" font-weight="700" letter-spacing="0.3" fill="#222838">
      <tspan fill-opacity="0.58">Let's build something</tspan> exceptional
    </text>

    <!-- contact pill -->
    <g filter="url(#lift)">
      <rect x="946" y="36" width="178" height="36" rx="18" fill="#222838"/>
    </g>
    <circle cx="969" cy="54" r="4.5" fill="#B8F352">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="985" y="58.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11" font-weight="500" letter-spacing="2.6" fill="#D6FB7C">OPEN TO WORK</text>

    <!-- hairline -->
    <rect x="76" y="96" width="1048" height="1.5" fill="#222838" opacity="0.22"/>

    <!-- bottom meta row -->
    <text x="76" y="128" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11.5" font-weight="700" letter-spacing="2.6" fill="#222838" fill-opacity="0.72">MDABDULLAH.DEV@GMAIL.COM</text>
    <text x="1124" y="128" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11.5" font-weight="700" letter-spacing="2.6" fill="#222838" fill-opacity="0.72" text-anchor="end">DHAKA, BANGLADESH · REMOTE</text>

    <rect width="1200" height="160" fill="url(#vignette)"/>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="158.5" rx="21.25" fill="none" stroke="#222838" stroke-width="1.5" stroke-opacity="0.16"/>
</svg>
