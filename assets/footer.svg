<svg width="1200" height="140" viewBox="0 0 1200 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;600&amp;family=JetBrains+Mono:wght@400&amp;display=swap');
    </style>

    <linearGradient id="fBg" x1="0" y1="0" x2="1200" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0E13"/>
      <stop offset="1" stop-color="#171D26"/>
    </linearGradient>

    <linearGradient id="fLime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7FD63A"/>
      <stop offset="50%" stop-color="#D2F97A"/>
      <stop offset="100%" stop-color="#7FD63A"/>
    </linearGradient>

    <radialGradient id="fGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#B4F04C" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#B4F04C" stop-opacity="0"/>
    </radialGradient>

    <pattern id="fChevron" width="48" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 19 L12 5 L24 19 L36 5 L48 19" fill="none" stroke="#B4F04C" stroke-width="3.5"/>
    </pattern>

    <linearGradient id="fEdgeFade" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.28" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <mask id="fMask">
      <rect width="1200" height="140" fill="url(#fEdgeFade)"/>
    </mask>
  </defs>

  <rect width="1200" height="140" rx="20" fill="url(#fBg)"/>

  <g mask="url(#fMask)" opacity="0.12">
    <rect width="1200" height="140" rx="20" fill="url(#fChevron)"/>
  </g>

  <circle cx="600" cy="70" r="240" fill="url(#fGlow)"/>

  <text x="600" y="64" font-family="'Sora','Segoe UI',sans-serif" font-size="22" font-weight="600" letter-spacing="0.4" fill="#F2F6EC" text-anchor="middle">
    Let's build something <tspan fill="#B4F04C">exceptional</tspan>
  </text>

  <text x="600" y="94" font-family="'JetBrains Mono',monospace" font-size="12" letter-spacing="2" fill="#5B6671" text-anchor="middle">MDABDULLAH.DEV@GMAIL.COM · DHAKA, BANGLADESH</text>

  <rect x="552" y="112" width="96" height="2.5" rx="1.25" fill="url(#fLime)"/>

  <rect x="0.75" y="0.75" width="1198.5" height="138.5" rx="19.25" fill="none" stroke="#1E2630" stroke-width="1.5"/>
</svg>
