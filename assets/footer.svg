<svg width="1200" height="130" viewBox="0 0 1200 130" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#070b12"/>
    </linearGradient>
    <linearGradient id="fText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0D1"/>
      <stop offset="100%" stop-color="#0088CC"/>
    </linearGradient>
    <radialGradient id="fGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00C7B7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00C7B7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="130" fill="url(#fBg)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#fText)"/>
  <circle cx="600" cy="65" r="220" fill="url(#fGlow)">
    <animate attributeName="r" values="220;260;220" dur="6s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="60" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="url(#fText)" text-anchor="middle">Thanks for stopping by 🚀</text>
  <text x="600" y="90" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#7d93a8" text-anchor="middle">Let's build something great together — mdabdullah.dev@gmail.com</text>
  <g fill="#00F0D1">
    <circle cx="450" cy="60"><animate attributeName="r" values="2;3.5;2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="60"><animate attributeName="r" values="2;3.5;2" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>
</svg>
